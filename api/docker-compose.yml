# Local development services. Start: `docker compose up -d` · Stop: `docker compose down`
# Values like ${POSTGRES_PASSWORD} come from the .env file next to this one (git-ignored).
name: deliverytracker

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"   # only reachable from this PC, not from the network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:                # Docker asks Postgres every 5 s: "are you ready?"
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"     # http://localhost:5050
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy   # wait until Postgres answers, not just "started"

volumes:
  pgdata:
  pgadmin:
